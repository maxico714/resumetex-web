services:
  # Docker runtime: the image installs the LaTeX engine itself, so Render's
  # read-only apt lists are never touched by the build command.
  - type: web
    name: resumetex-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # 1 = the server may run pdflatex locally. 0 = the server never sees a
      # document (AI + canvas + .tex export only).
      - key: RESUMETEX_ALLOW_COMPILE
        value: "1"
      - key: RESUMETEX_HOST
        value: "0.0.0.0"
